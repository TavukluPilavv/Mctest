name: Build Mctest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build mod
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mctest-jar
          path: build/libs/*.jar
